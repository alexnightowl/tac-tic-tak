# Launch fresh and open the dev menu. Use with runFlow, then tap a lab:
#   - tapOn: { id: dev-board-lab }
appId: online.tactictak.app
---
- runFlow: dismiss-system.yaml
- launchApp:
    stopApp: true
- runFlow: dismiss-system.yaml
# A fresh account left on the welcome slides by another flow: close them.
- extendedWaitUntil:
    visible:
      id: "(open-dev|screen-onboarding)"
    timeout: 60000
- runFlow:
    when:
      visible: { id: screen-onboarding }
    commands:
      - tapOn: { id: screen-onboarding-close }
- extendedWaitUntil:
    visible:
      id: open-dev
    timeout: 60000
- tapOn:
    id: open-dev
- assertVisible:
    id: dev-menu
