# Phase 4 shell: login → the five tabs → the avatar menu → every stub route
# opens and closes → language en ↔ uk on the tab labels → logout.
# The language switch PATCHes the account's settings, so use a user no other
# flow asserts English copy on (local: e2e_shell, same password as e2e_slice).
# Local backend only. Run with:
#   maestro test -e E2E_USER=e2e_shell -e E2E_PASSWORD=… .maestro/04-shell.yaml
appId: online.tactictak.app
---
- runFlow: common/dismiss-system.yaml
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- runFlow: common/dismiss-system.yaml
- extendedWaitUntil:
    visible: { id: login-screen }
    timeout: 60000
- tapOn: { id: login-nickname }
- inputText: ${E2E_USER}
# Reveal first: Maestro drops characters typed into a secure field when the
# simulator keyboard isn't Latin (the uk switch below can leave it Cyrillic).
- tapOn: { id: login-password-eye }
- tapOn: { id: login-password }
- inputText: ${E2E_PASSWORD}
- tapOn: { id: login-brand }
- tapOn: { id: login-submit }
- repeat:
    times: 20
    while:
      notVisible: { id: home-screen }
    commands:
      - tapOn:
          text: Not Now
          optional: true
- extendedWaitUntil:
    visible: { id: home-screen }
    timeout: 20000
- assertVisible: { id: shell-header }
- assertVisible: { id: tab-bar }
- assertVisible: { id: open-dev }

# English to start (the account may have been left in uk by a failed run).
- tapOn: { id: header-avatar }
- extendedWaitUntil:
    visible: { id: account-menu }
    timeout: 5000
- tapOn: { id: menu-lang-en }
- swipe:
    start: "50%, 45%"
    end: "50%, 95%"
    duration: 300
- extendedWaitUntil:
    notVisible: { id: account-menu }
    timeout: 5000

# The five tabs.
- tapOn: { id: tab-play }
- extendedWaitUntil:
    visible: { id: play-setup }
    timeout: 5000
- tapOn: { id: tab-review }
- assertVisible: { id: screen-review }
- tapOn: { id: tab-stats }
- assertVisible: { id: screen-stats }
- tapOn: { id: tab-social }
- assertVisible: { id: screen-social }
- tapOn: { id: tab-home }
- assertVisible: { id: home-screen }
# Home's Play plate switches to the Play tab.
- tapOn: { id: home-play }
- extendedWaitUntil:
    visible: { id: play-setup }
    timeout: 5000
- tapOn: { id: tab-home }
- takeScreenshot: shell-home-en

# Avatar menu → profile, friends, settings (native back between).
- tapOn: { id: header-avatar }
- extendedWaitUntil:
    visible: { id: account-menu }
    timeout: 5000
- assertVisible: { id: menu-name }
- takeScreenshot: shell-menu-en
- tapOn: { id: menu-profile }
- extendedWaitUntil:
    visible: { id: screen-profile }
    timeout: 5000
- extendedWaitUntil:
    visible: { id: profile-name, text: "${E2E_USER}" }
    timeout: 8000
- runFlow: common/shell-back.yaml
- tapOn: { id: header-avatar }
- tapOn: { id: menu-friends }
- extendedWaitUntil:
    visible: { id: screen-friends }
    timeout: 5000
- runFlow: common/shell-back.yaml
- tapOn: { id: header-avatar }
- tapOn: { id: menu-settings }
- extendedWaitUntil:
    visible: { id: screen-settings }
    timeout: 5000
- runFlow: common/shell-back.yaml

# Every other stub route, by deep link (tactictak://<path>).
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: sessions, SCREEN: screen-sessions, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: sessions/abc, SCREEN: screen-session, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: sessions/abc/review, SCREEN: screen-session-review, KIND: modal } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: review/p1, SCREEN: screen-drill, KIND: modal } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: puzzles/p1, SCREEN: screen-puzzle, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: settings/profile, SCREEN: screen-settings-profile, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: settings/gameplay, SCREEN: screen-settings-gameplay, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: settings/sound, SCREEN: screen-settings-sound, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: settings/notifications, SCREEN: screen-settings-notifications, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: settings/account, SCREEN: screen-settings-account, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: settings/about, SCREEN: screen-settings-about, KIND: push } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: onboarding, SCREEN: screen-onboarding, KIND: modal } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: play/theme-picker, SCREEN: screen-theme-picker, KIND: sheet } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: friends/search, SCREEN: screen-friend-search, KIND: sheet } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: avatar-source, SCREEN: screen-avatar-source, KIND: sheet } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: achievement/first-session, SCREEN: screen-achievement, KIND: sheet } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: streak, SCREEN: screen-streak, KIND: sheet } }
- runFlow: { file: common/shell-route.yaml, env: { ROUTE: no/such/page, SCREEN: not-found-screen, KIND: notfound } }

# Language: en → uk shows on the tab labels at once, then back to en.
- assertVisible: { id: tab-label-home, text: Home }
- tapOn: { id: header-avatar }
- extendedWaitUntil:
    visible: { id: account-menu }
    timeout: 5000
- tapOn: { id: menu-lang-uk }
- extendedWaitUntil:
    visible: { id: menu-settings, label: Налаштування }
    timeout: 5000
- takeScreenshot: shell-menu-uk
- swipe:
    start: "50%, 45%"
    end: "50%, 95%"
    duration: 300
- extendedWaitUntil:
    notVisible: { id: account-menu }
    timeout: 5000
- assertVisible: { id: tab-label-home, text: Головна }
- assertVisible: { id: tab-label-social, text: Спільнота }
- takeScreenshot: shell-home-uk
# Survives a relaunch (MMKV + server).
- stopApp
- launchApp
- extendedWaitUntil:
    visible: { id: home-screen }
    timeout: 60000
- assertVisible: { id: tab-label-home, text: Головна }
- tapOn: { id: header-avatar }
- extendedWaitUntil:
    visible: { id: account-menu }
    timeout: 5000
- tapOn: { id: menu-lang-en }
- extendedWaitUntil:
    visible: { id: menu-settings, label: Settings }
    timeout: 5000

# Logout from the menu → login.
- tapOn: { id: menu-logout }
- extendedWaitUntil:
    visible: { id: login-screen }
    timeout: 10000
- assertNotVisible: { id: tab-bar }
