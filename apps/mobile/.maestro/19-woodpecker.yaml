# Woodpecker method (D41): Play → the method's intro → Start (a "book" set
# for the Play style) → the first cycle's page and today's portion → "What is
# the Woodpecker method?" → cycle 1: whose move it is, no hint, a wrong move
# shows the solution → back on the set page. An active set from an earlier
# run is archived first. Env: E2E_USER, E2E_PASSWORD, SHOTS.
appId: online.tactictak.app
---
- runFlow:
    file: 09-login.yaml
- runFlow:
    when: { visible: { id: screen-onboarding } }
    commands:
      - tapOn: { id: onboarding-skip, optional: true }
- runFlow: { file: common/tap-tab.yaml, env: { TAB: play, SCREEN: play-setup } }
- scrollUntilVisible: { element: { id: play-woodpecker }, direction: DOWN, centerElement: true, timeout: 15000 }
- tapOn: { id: play-woodpecker }
- extendedWaitUntil: { visible: { id: "(woodpecker-empty|woodpecker-current)" }, timeout: 15000 }
- runFlow:
    when: { visible: { id: woodpecker-current } }
    commands:
      - scrollUntilVisible: { element: { id: woodpecker-archive }, direction: DOWN, centerElement: true }
      - tapOn: { id: woodpecker-archive }
      - tapOn: { id: woodpecker-archive-confirm }
      - extendedWaitUntil: { visible: { id: woodpecker-empty }, timeout: 15000 }
- takeScreenshot: ${SHOTS}/01-intro

- tapOn: { id: woodpecker-cta }
- extendedWaitUntil: { visible: { id: woodpecker-current }, timeout: 30000 }
- assertVisible: { id: woodpecker-today }
- assertVisible: { id: woodpecker-close-min }
- takeScreenshot: ${SHOTS}/02-first-cycle

- scrollUntilVisible: { element: { id: woodpecker-about-open }, direction: DOWN, centerElement: true }
- tapOn: { id: woodpecker-about-open }
- extendedWaitUntil: { visible: { id: woodpecker-about-book }, timeout: 5000 }
- takeScreenshot: ${SHOTS}/03-about
- swipe: { start: "50%, 45%", end: "50%, 95%", duration: 300 }
- extendedWaitUntil: { notVisible: { id: woodpecker-about-book }, timeout: 5000 }

- tapOn: { id: woodpecker-cta }
- extendedWaitUntil: { visible: { id: woodpecker-goal }, timeout: 15000 }
- assertNotVisible: { id: woodpecker-hint }
- assertVisible: { id: woodpecker-today-chip }
- takeScreenshot: ${SHOTS}/04-solve
- extendedWaitUntil: { visible: { id: e2e-wrong }, timeout: 10000 }
- tapOn: { id: e2e-wrong }
- extendedWaitUntil: { visible: { id: woodpecker-next }, timeout: 10000 }
- assertVisible: { id: woodpecker-note }
- takeScreenshot: ${SHOTS}/05-missed-solution
- tapOn: { id: woodpecker-solve-exit }
- extendedWaitUntil: { visible: { id: woodpecker-current }, timeout: 10000 }
- takeScreenshot: ${SHOTS}/06-after
