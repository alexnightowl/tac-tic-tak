# Register: login → "Sign up" → live rule checklist → new account lands on
# Home; taken nickname shows an inline error. Local backend only. Run with:
#   maestro test -e E2E_USER=… .maestro/02-register.yaml
appId: online.tactictak.app
---
- runFlow: common/dismiss-system.yaml
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- runFlow: common/dismiss-system.yaml
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 60000
- tapOn:
    id: login-to-register
- assertVisible:
    id: register-screen
- assertVisible:
    id: register-nick-rules-len-unmet
- evalScript: ${output.nick = 'reg_' + Math.floor(Math.random() * 1e6)}

# Taken nickname → inline error, still on register.
- tapOn:
    id: register-nickname
- inputText: ${E2E_USER}
- tapOn:
    id: register-password
# iOS offers "Use Strong Password?" for new-password fields (the autofill we
# want). The sheet lives in another process, invisible to Maestro: close it
# by its ✕ position (91%,58%: iPhone 17 and Air).
- waitForAnimationToEnd
- tapOn:
    point: 91%,58%
    optional: true
# Reveal both fields first: Maestro drops characters typed into secure
# fields when the simulator keyboard isn't Latin.
- tapOn:
    id: register-password-eye
- tapOn:
    id: register-repeat-eye
- tapOn:
    id: register-password
- inputText: secret123
- assertVisible:
    id: register-pw-rules-digit-met
# The keyboard can cover the repeat field: drop it before tapping there.
- hideKeyboard:
    optional: true
- tapOn:
    id: register-brand
- tapOn:
    id: register-repeat
- inputText: secret123
- assertVisible:
    id: register-pw-rules-match-met
# The keyboard covers the submit plate; Return on the last field submits.
- tapOn:
    id: register-repeat
- pressKey: Enter
- extendedWaitUntil:
    visible: "That nickname is already taken|Цей нікнейм уже зайнятий"
    timeout: 10000

# Fresh nickname → Home.
- hideKeyboard:
    optional: true
- tapOn:
    id: register-brand
- tapOn:
    id: register-nickname
- eraseText: 40
- inputText: ${output.nick}
# The keyboard covers the submit plate; Return on the last field submits.
- hideKeyboard:
    optional: true
- tapOn:
    id: register-brand
- tapOn:
    id: register-repeat
- pressKey: Enter
# A new account meets the welcome steps (onboarding gate); the top bar's
# Skip closes them. iOS may ask to save the password first.
- repeat:
    times: 15
    while:
      notVisible: { id: screen-onboarding }
    commands:
      - tapOn:
          text: "Not Now|Не зараз"
          optional: true
- extendedWaitUntil:
    visible:
      id: screen-onboarding
    timeout: 15000
- tapOn:
    id: screen-onboarding-close
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
- assertVisible:
    id: home-nickname
    text: ${output.nick}
