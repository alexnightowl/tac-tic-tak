# Phase 7 / design v2: the Achievements side lists the catalogue (star-repo,
# set-accent and set-board hidden), a medal opens the detail sheet (swipe
# down closes it), and a settings change that unlocks
# an achievement shows the global toast. The toast step needs set-language
# still locked for the user (local reset:
#   delete from "UserAchievement" where slug='set-language' and "userId"=…).
#   maestro test -e E2E_USER=e2e_stats -e E2E_PASSWORD=… .maestro/07-achievements.yaml
appId: online.tactictak.app
---
- runFlow: 07-sub-login.yaml
- tapOn: { id: tab-stats }
- tapOn: { id: stats-tab-achievements }
- extendedWaitUntil:
    visible: { id: achievements-progress }
    timeout: 15000
- assertVisible: { id: achievements-total, text: "20" }
- assertNotVisible: { id: achievement-star-repo }
- assertNotVisible: { id: achievement-set-accent }
- tapOn: { id: achievements-chip-streak }
- assertVisible: { id: achievements-section-streak }
- assertNotVisible: { id: achievements-section-play }
- tapOn: { id: achievements-chip-all }
- tapOn: { id: achievement-first-session }
- extendedWaitUntil:
    visible: { id: screen-achievement }
    timeout: 5000
- assertVisible: { id: achievement-state }
- assertVisible: { id: achievement-tier }
- swipe:
    start: "50%, 60%"
    end: "50%, 98%"
    duration: 300
- extendedWaitUntil:
    notVisible: { id: screen-achievement }
    timeout: 5000
# Settings change → achievementsUnlocked → toast (language via the menu).
- tapOn: { id: header-avatar }
- extendedWaitUntil:
    visible: { id: account-menu }
    timeout: 5000
- tapOn: { id: menu-lang-uk }
- extendedWaitUntil:
    visible: { id: toast-achievement }
    timeout: 8000
- swipe:
    from: { id: toast-achievement }
    direction: UP
    duration: 300
- extendedWaitUntil:
    visible: { id: account-menu }
    timeout: 8000
- tapOn: { id: menu-lang-en }
- swipe:
    start: "50%, 45%"
    end: "50%, 95%"
    duration: 300
- extendedWaitUntil:
    notVisible: { id: account-menu }
    timeout: 5000
