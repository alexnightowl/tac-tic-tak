# Phase 9 helper: open Settings from a tab root (avatar → account menu →
# Settings; Settings left the tab bar with the Learn tab), or stay when it
# is already open. Retries the avatar tap: right after login or a bundle
# reload the first tap can land before the header is interactive. Scrolls
# back to the top.
appId: online.tactictak.app
---
- runFlow:
    when: { notVisible: { id: screen-settings } }
    commands:
      - extendedWaitUntil: { visible: { id: header-avatar }, timeout: 10000 }
      - repeat:
          times: 4
          while:
            notVisible: { id: account-menu }
          commands:
            - tapOn: { id: header-avatar, retryTapIfNoChange: false }
            - extendedWaitUntil: { visible: { id: account-menu }, timeout: 3000, optional: true }
      - tapOn: { id: menu-settings }
- extendedWaitUntil: { visible: { id: screen-settings }, timeout: 10000 }
- scrollUntilVisible:
    element: { id: settings-profile }
    direction: UP
    timeout: 5000
