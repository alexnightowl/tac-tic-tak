# Phase 5 helper (also runs alone): fresh launch, sign out whoever is in,
# sign in as E2E_USER, land on Home. The 05-* outcome flows start with it.
#   maestro test -e E2E_USER=… -e E2E_PASSWORD=… .maestro/05-login.yaml
appId: online.tactictak.app
---
- runFlow: common/dismiss-system.yaml
- launchApp:
    stopApp: true
- runFlow: common/dismiss-system.yaml
- extendedWaitUntil:
    visible:
      id: "(home-screen|login-screen|play-setup|pause-overlay|summary-screen|screen-onboarding)"
    timeout: 60000
# A fresh account another flow left on the welcome slides: close them.
- runFlow:
    when:
      visible: { id: screen-onboarding }
    commands:
      - tapOn: { id: screen-onboarding-close }
# Signed in: back to Home. Another account is logged out with Home's
# dev-build button (the account menu's Log out trips a dev-only GO_BACK
# LogBox, see the Phase 5 report); the right one just refreshes.
- runFlow:
    when:
      visible:
        id: tab-bar
    commands:
      - tapOn: { id: tab-home }
      - extendedWaitUntil:
          visible: { id: home-screen }
          timeout: 5000
- runFlow:
    when:
      visible: { id: home-screen }
      notVisible: { id: home-nickname, text: "${E2E_USER}" }
    commands:
      - scrollUntilVisible:
          element: { id: home-logout }
          direction: DOWN
          centerElement: true
          timeout: 10000
      - tapOn: { id: home-logout }
      - extendedWaitUntil:
          visible: { id: login-screen }
          timeout: 20000
- runFlow:
    when:
      visible: { id: login-screen }
    commands:
      - tapOn: { id: login-nickname }
      - eraseText: 40
      - inputText: ${E2E_USER}
      # Reveal first: secure fields drop characters under a non-Latin keyboard.
      - tapOn: { id: login-password-eye }
      - tapOn: { id: login-password }
      - eraseText: 40
      - inputText: ${E2E_PASSWORD}
      - tapOn: { id: login-brand }
      - tapOn: { id: login-submit }
# iOS may offer to save the password (see 02-auth.yaml).
- repeat:
    times: 20
    while:
      notVisible:
        id: home-screen
    commands:
      - tapOn:
          text: Not Now
          optional: true
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000
# Seeded server state (05-outcomes.sh): pull to refresh /users/me.
- swipe: { start: "50%, 30%", end: "50%, 75%", duration: 500 }
- extendedWaitUntil:
    visible: { id: never-there }
    timeout: 2000
    optional: true
