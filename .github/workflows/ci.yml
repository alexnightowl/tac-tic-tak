name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Disposable Postgres/Redis on the same host ports as local dev, so the
    # backend e2e suite (test DB taktic_test, Redis index 1) runs unchanged.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taktic
          POSTGRES_PASSWORD: taktic
          POSTGRES_DB: taktic_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taktic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          # 22 for the Expo app (SDK 58 needs >=22.13). The Docker images
          # stay on node:20 until a deliberate bump.
          node-version: 22
          cache: pnpm
      # Strict: a lockfile out of sync with package.json fails here instead
      # of being papered over by a fresh resolve.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec prisma generate
      - run: pnpm -r run typecheck
      - run: pnpm -r --if-present run test
      - run: pnpm -r run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No-op until apps/mobile exists (the 'mobile' branch and later main).
      - id: has
        run: echo "mobile=$([ -f apps/mobile/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.mobile == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - if: steps.has.outputs.mobile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.has.outputs.mobile == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.has.outputs.mobile == 'true'
        run: pnpm --filter mobile run typecheck
      - if: steps.has.outputs.mobile == 'true'
        run: npx --yes expo-doctor
        working-directory: apps/mobile

  # Mobile- or docs-only pushes must not rebuild and restart prod.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - 'apps/backend/**'
              - 'apps/frontend/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'

  deploy:
    needs: [build, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /opt/tac-tic-tak
            # fetch + reset instead of pull --ff-only so deploys
            # survive a force-push on main. The VPS clone is a
            # deploy-only mirror; it never has local edits worth
            # preserving.
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose --profile app build
            docker compose --profile app up -d --remove-orphans
            # nginx.conf is a bind-mount; `up -d` doesn't recreate the
            # container when only file content changes, and `nginx -s reload`
            # has proven flaky here. Force a clean recreate so the running
            # process reads the current conf on disk.
            docker compose --profile app up -d --force-recreate nginx
            # Log the first lines so the CI output tells us which conf is live.
            docker compose exec -T nginx sh -c 'sed -n "1,40p" /etc/nginx/nginx.conf' || true
            docker image prune -f
